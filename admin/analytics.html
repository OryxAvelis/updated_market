<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — AM MARKET Admin</title>
  <meta name="description" content="AM MARKET administration analytics for order activity.">
  <script src="js/admin-theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
  <link rel="stylesheet" href="css/admin-analytics.css">
  <link rel="icon" type="image/png" href="../img/logo-round.png">
</head>
<body class="admin-app admin-shell-pending" data-admin="true" data-page="admin-analytics" data-admin-page="analytics">
  <main class="admin-main" id="adminMain" tabindex="-1">
    <section class="admin-page admin-analytics-page" aria-labelledby="analyticsPageTitle">
    <header class="admin-page-header">
      <div><p class="admin-page-eyebrow" data-i18n="admin_insights">Insights</p><h1 class="admin-page-title" id="analyticsPageTitle" data-i18n="admin_analytics_title">Analytics</h1><p class="admin-page-intro" data-i18n="admin_analytics_intro">Review order activity available on this device for the selected period.</p></div>
      <label class="admin-period-control" for="analyticsPeriod"><span data-i18n="admin_period">Period</span><select id="analyticsPeriod" class="admin-select"><option value="7" data-i18n="admin_last_7_days">Last 7 days</option><option value="30" data-i18n="admin_last_30_days" selected>Last 30 days</option><option value="90" data-i18n="admin_last_90_days">Last 90 days</option><option value="all" data-i18n="admin_all_time">All time</option></select></label>
    </header>
    <div class="admin-analytics-source" id="analyticsSourceNote" role="status" aria-live="polite"></div>
    <section class="admin-metric-grid" id="analyticsMetrics" aria-label="Analytics metrics" data-i18n-aria="admin_analytics_metrics"></section>
    <div class="admin-analytics-grid">
      <section class="admin-card admin-chart-panel" aria-labelledby="salesTrendTitle">
        <header class="admin-card-header"><div><h2 class="admin-card-title" id="salesTrendTitle" data-i18n="admin_sales_trend">Sales trend</h2><p class="admin-card-subtitle" data-i18n="admin_sales_trend_sub">Order totals grouped across the selected period.</p></div></header>
        <div id="salesTrendChart" class="admin-card-body admin-chart" aria-live="polite"></div>
      </section>
      <section class="admin-card admin-chart-panel" aria-labelledby="ordersStatusTitle">
        <header class="admin-card-header"><div><h2 class="admin-card-title" id="ordersStatusTitle" data-i18n="admin_orders_by_status">Orders by status</h2><p class="admin-card-subtitle" data-i18n="admin_orders_by_status_sub">Distribution of the selected order data.</p></div></header>
        <div id="orderStatusChart" class="admin-card-body admin-chart" aria-live="polite"></div>
      </section>
    </div>
    <section class="admin-card admin-best-sellers-card" aria-labelledby="bestSellersTitle">
      <header class="admin-card-header"><div><h2 class="admin-card-title" id="bestSellersTitle" data-i18n="admin_best_sellers">Best sellers</h2><p class="admin-card-subtitle" data-i18n="admin_best_sellers_sub">Ranked by units in the selected order data.</p></div></header>
      <div id="bestSellersList" class="admin-list-region" aria-live="polite" aria-busy="true"><div class="admin-state"><span class="spinner-border" aria-hidden="true"></span><p data-i18n="admin_loading">Loading…</p></div></div>
    </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/core.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-core.js"></script>
  <script src="js/admin-analytics.js"></script>
</body>
</html>
