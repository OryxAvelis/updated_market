<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Password — AM MARKET</title>
  <meta name="description" content="Choose a new password for your AM MARKET account." />
  <script src="js/theme-init.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store-api.js"></script>
  <script src="js/reset-password.js"></script>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon" type="image/png" href="img/logo-round.png" />
</head>
<body class="reset-page" data-page="reset-password">
  <a href="login.html" class="back-home"><span aria-hidden="true">←</span> <span data-i18n="sign_in_link">Sign in</span></a>

  <button class="lang-float" data-lang-toggle type="button" title="Français / English" aria-label="Change language" data-i18n-aria="change_language">
    <span aria-hidden="true">◎</span> <span id="langLabel">EN</span>
  </button>

  <main class="auth-card reset-card" id="mainContent">
    <div class="reset-shell">
      <a href="index.html" class="reset-logo" aria-label="AM MARKET home">
        <img src="img/logo-round.png" alt="AM MARKET" />
      </a>
      <p class="reset-eyebrow" data-reset-copy="eyebrow">Secure account recovery</p>
      <h1 id="resetTitle" data-reset-copy="title">Choose a new password</h1>
      <p class="reset-intro" data-reset-copy="subtitle">Choose a strong password that you do not use on another website.</p>

      <div class="auth-alert" id="resetAlert" role="alert" aria-live="assertive" tabindex="-1" hidden></div>

      <form id="resetForm" class="reset-form" novalidate>
        <div class="input-group-custom" id="newPasswordWrap">
          <span class="field-icon" aria-hidden="true">●</span>
          <label class="visually-hidden" for="newPassword" data-reset-copy="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required data-reset-copy-placeholder="passwordPlaceholder" />
          <button type="button" class="eye" data-eye="newPassword" aria-controls="newPassword" aria-pressed="false" data-reset-copy-aria="showPassword"><span aria-hidden="true">◉</span></button>
        </div>
        <div class="field-error" id="newPasswordError" role="alert"></div>

        <div class="input-group-custom" id="confirmPasswordWrap">
          <span class="field-icon" aria-hidden="true">●</span>
          <label class="visually-hidden" for="confirmPassword" data-reset-copy="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required data-reset-copy-placeholder="confirmPlaceholder" />
          <button type="button" class="eye" data-eye="confirmPassword" aria-controls="confirmPassword" aria-pressed="false" data-reset-copy-aria="showPassword"><span aria-hidden="true">◉</span></button>
        </div>
        <div class="field-error" id="confirmPasswordError" role="alert"></div>
        <p class="password-rule" data-reset-copy="passwordRule">Use 12–128 characters.</p>

        <button class="btn-submit" type="submit" id="resetSubmit">
          <span class="auth-spinner" aria-hidden="true" hidden></span>
          <span data-submit-label data-reset-copy="submit">Change password</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <a class="reset-signin-link" id="resetSignIn" href="login.html" hidden><span data-reset-copy="continueSignin">Continue to sign in</span> <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
