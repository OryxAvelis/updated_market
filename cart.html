<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM MARKET — Your Cart</title>
  <meta name="description" content="Review the products in your AM MARKET cart and proceed to checkout. Free delivery on orders over 200 DH." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AM MARKET" />
  <meta property="og:title" content="AM MARKET — Your Cart" />
  <meta property="og:description" content="Review your cart and proceed to checkout. Free delivery on orders over 200 DH." />
  <meta property="og:image" content="https://raw.githubusercontent.com/OryxAvelis/updated_market/main/img/logo-round.png" />
  <meta name="twitter:card" content="summary" />
  <script>(function(){var t=localStorage.getItem('am_theme')==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="icon" type="image/png" href="img/logo-round.png" />
</head>
<body data-page="cart">

  <main class="container-fluid px-3 px-lg-4 py-3">
    <h4 class="fw-bold mb-4"><span data-i18n="your_cart">Your Cart</span> <span class="text-muted fs-6" id="cartLabel">(0)</span></h4>
    <div class="row g-4">
      <div class="col-lg-8" id="cartItems"></div>
      <div class="col-lg-4" id="summaryCol" style="display:none">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="fw-bold mb-3" data-i18n="order_summary">Order Summary</h6>
            <div class="d-flex justify-content-between mb-2"><span class="text-muted" data-i18n="subtotal">Subtotal</span><span id="subTotal">0 DH</span></div>
            <div class="d-flex justify-content-between mb-2"><span class="text-muted" data-i18n="delivery">Delivery</span><span id="delivFee">0 DH</span></div>
            <hr>
            <div class="d-flex justify-content-between fw-bold fs-5 mb-3"><span data-i18n="total">Total</span><span class="text-orange" id="grandTotal">0 DH</span></div>
            <button class="btn btn-orange w-100 btn-lg" id="goCheckout" disabled data-i18n="proceed">Proceed to Checkout</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
