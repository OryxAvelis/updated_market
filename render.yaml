services:
  - type: web
    name: am-market
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix server && npm run check --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: am_market
      - key: DB_USER
        value: am_market_app
      - key: DB_PASSWORD
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DB_TLS
        value: "true"
      - key: DB_TLS_CA_PATH
        value: /etc/secrets/aiven-ca.pem
      - key: DB_TLS_SERVERNAME
        sync: false
      - key: LOW_STOCK_EVALUATOR_ENABLED
        value: "true"
      - key: LOCAL_DEV_LOGIN
        value: "false"
      - key: HSTS_MAX_AGE_SECONDS
        value: "300"
      - key: HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: HSTS_PRELOAD
        value: "false"
      - key: FULFILLMENT_WEBHOOK_SECRET
        generateValue: true
