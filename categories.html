<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM MARKET — All Categories</title>
  <meta name="description"
    content="Browse all AM MARKET categories — groceries, beverages, dairy, snacks, hygiene and more. Filter by price, brand and availability." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AM MARKET" />
  <meta property="og:title" content="AM MARKET — All Categories" />
  <meta property="og:description"
    content="Browse all AM MARKET categories — groceries, beverages, dairy, snacks, hygiene and more." />
  <meta property="og:image"
    content="https://raw.githubusercontent.com/OryxAvelis/updated_market/main/img/logo-round.png" />
  <meta name="twitter:card" content="summary" />
  <script>(function () { var t = localStorage.getItem('am_theme') === 'dark' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-bs-theme', t); })();</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/categories.css" />
  <link rel="icon" type="image/png" href="img/logo-round.png" />
</head>

<body data-page="categories">

  <main class="container-fluid px-3 px-lg-4 py-3">
    <nav class="mb-3">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html" data-i18n="home">Home</a></li>
        <li class="breadcrumb-item active" id="shopCrumb">All Categories</li>
      </ol>
    </nav>

    <div class="row g-3">
      <!-- FILTERS -->
      <div class="col-md-3 filter-column" id="filterColumn" aria-hidden="false">
        <div class="card border-0 shadow-sm filters-panel sticky-top" id="filtersPanel" style="top:90px">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold mb-0" data-i18n="filters">Filters</h6>
              <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link btn-sm text-orange p-0" id="clearFilters" data-i18n="clear">Clear</button>
                <button class="filter-close" id="closeFilters" type="button" aria-label="Close filters" data-i18n-aria="close_filters">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>

            <h6 class="fw-semibold small text-muted mb-2" data-i18n="category">Category</h6>
            <div id="filterCategories" class="mb-3 filter-scroll"></div>

            <h6 class="fw-semibold small text-muted mb-2" data-i18n="price_page">Maximum price on this page</h6>
            <div class="mb-3">
              <input type="range" class="form-range" id="priceRange" min="0" max="1000" step="10" value="1000"
                aria-label="Maximum price" data-i18n-aria="max_price">
              <div class="d-flex justify-content-between small text-muted">
                <span>0</span>
                <label class="price-input-label" for="priceMaxInput">
                  <input type="number" id="priceMaxInput" min="0" max="1000" step="10" value="1000"
                    aria-label="Maximum price" data-i18n-aria="max_price">
                  <span>DH</span>
                </label>
              </div>
            </div>

            <h6 class="fw-semibold small text-muted mb-2" data-i18n="brand_page">Brands on this page</h6>
            <div id="filterBrands" class="filter-scroll mb-2"></div>
          </div>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div class="col-md-9">
        <div class="shop-toolbar d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
              <i class="fa-solid fa-sliders"></i>
              <span data-i18n="filter_products">Filter</span>
              <span class="filter-count" id="filterCount" hidden>0</span>
            </button>
            <h4 class="fw-bold mb-0" id="shopTitle">All Categories</h4>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="small text-muted" id="resultCount"></span>
            <label class="visually-hidden" for="sortSelect" data-i18n="sort_by">Sort products</label>
            <select class="form-select form-select-sm w-auto" id="sortSelect" aria-label="Sort products" data-i18n-aria="sort_by">
              <option value="default" data-i18n="sort_default">Default</option>
              <option value="price-asc" data-i18n="sort_asc">Price: Low to High</option>
              <option value="price-desc" data-i18n="sort_desc">Price: High to Low</option>
              <option value="name" data-i18n="sort_name">Name A–Z</option>
            </select>
          </div>
        </div>
        <div class="active-filters" id="activeFilters" aria-live="polite"></div>
        <div class="row g-3" id="shopProducts"></div>
        <nav class="mt-4" id="paginationNav" style="display:none">
          <ul class="pagination justify-content-center flex-wrap mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/categories.js"></script>
</body>

</html>
