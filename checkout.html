<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM MARKET — Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="icon" type="image/png" href="img/logo-round.png" />
</head>
<body data-page="checkout">

  <main class="container-fluid px-3 px-lg-4 py-3">
    <h4 class="fw-bold mb-4" data-i18n="checkout">Checkout</h4>
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <h6 class="fw-bold mb-3" data-i18n="delivery_info">Delivery Information</h6>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" data-i18n="full_name">Full Name *</label><input type="text" class="form-control" id="cName" required></div>
              <div class="col-md-6"><label class="form-label" data-i18n="phone">Phone *</label><input type="tel" class="form-control" id="cPhone" required></div>
              <div class="col-12"><label class="form-label" data-i18n="email_label">Email *</label><input type="email" class="form-control" id="cEmail" required></div>
              <div class="col-12"><label class="form-label" data-i18n="address">Address *</label><textarea class="form-control" id="cAddress" rows="2" required></textarea></div>
              <div class="col-md-6"><label class="form-label" data-i18n="city">City *</label><input type="text" class="form-control" id="cCity" required></div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="fw-bold mb-3" data-i18n="payment_method">Payment Method</h6>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pay" id="pay1" value="Cash on Delivery" checked><label class="form-check-label" for="pay1" data-i18n="cod">Cash on Delivery</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pay" id="pay2" value="Card"><label class="form-check-label" for="pay2" data-i18n="card_label">Credit / Debit Card</label></div>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm checkout-summary">
          <div class="card-body">
            <h6 class="fw-bold mb-3" data-i18n="order_summary">Order Summary</h6>
            <div id="coItems"></div>
            <hr>
            <div class="d-flex justify-content-between mb-1"><span class="text-muted" data-i18n="subtotal">Subtotal</span><span id="coSub">0 DH</span></div>
            <div class="d-flex justify-content-between mb-1"><span class="text-muted" data-i18n="delivery">Delivery</span><span id="coFee">0 DH</span></div>
            <div class="d-flex justify-content-between fw-bold fs-5 mt-2"><span data-i18n="total">Total</span><span class="text-orange" id="coTotal">0 DH</span></div>
            <button class="btn btn-orange w-100 btn-lg mt-3" id="placeOrder" data-i18n="place_order">Place Order</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
