<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM MARKET — Product</title>
  <meta name="description" content="View product details, prices and availability at AM MARKET — your Moroccan online supermarket with fast delivery all over Morocco." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AM MARKET" />
  <meta property="og:title" content="AM MARKET — Product" />
  <meta property="og:description" content="Product details, prices and availability at AM MARKET — your Moroccan online supermarket." />
  <meta property="og:image" content="https://raw.githubusercontent.com/OryxAvelis/updated_market/main/img/logo-round.png" />
  <meta name="twitter:card" content="summary" />
  <script src="js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css?v=20260824-ui-polish" />
  <link rel="stylesheet" href="css/product.css?v=20260825-review-ux" />
  <link rel="icon" type="image/png" href="img/logo-round.png" />
</head>
<body data-page="product">

  <main class="container-fluid px-3 px-lg-4 py-3">
    <nav class="mb-3" aria-label="Breadcrumb" data-i18n-aria="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html" data-i18n="home">Home</a></li>
        <li class="breadcrumb-item"><a href="categories.html" data-i18n="products">Products</a></li>
        <li class="breadcrumb-item active" id="detailCrumb" data-i18n="product_crumb" aria-current="page">Product</li>
      </ol>
    </nav>
    <div class="row g-4" id="detailContent"></div>
    <section class="product-reviews mt-5" id="reviewsSection" aria-labelledby="reviewsHeading">
      <div class="reviews-layout">
        <div class="reviews-overview">
          <span class="reviews-overview-icon" aria-hidden="true"><i class="fa-regular fa-comments"></i></span>
          <div class="reviews-heading-row">
            <h2 class="h4 fw-bold mb-1" id="reviewsHeading" tabindex="-1">Customer reviews</h2>
            <p class="text-muted mb-0" id="reviewsSummary" aria-live="polite">Loading reviews…</p>
          </div>
        </div>
        <div class="reviews-content">
          <div id="reviewComposer"></div>
          <div class="reviews-list" id="reviewsList" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <div class="mt-5" id="relatedSection" style="display:none">
      <h2 class="h4 fw-bold mb-3" data-i18n="related">Related Products</h2>
      <div class="row g-3" id="relatedProducts"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/i18n.js?v=20260824-ui-polish"></script>
  <script src="js/store-api.js?v=20260824-ui-polish"></script>
  <script src="js/core.js?v=20260824-ui-polish"></script>
  <script src="js/product.js?v=20260825-review-ux"></script>
</body>
</html>
